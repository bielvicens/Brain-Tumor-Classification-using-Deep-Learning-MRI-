# Rutes de les carpetes
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  models: "models"

# Hiperparàmetres de la xarxa neuronal
training:
  img_size: 224
  batch_size: 32
  epochs: 15
  learning_rate: 0.0001
# Les 4 categories de tumors del dataset de Kaggle
classes:
  0: glioma_tumor
  1: meningioma_tumor
  2: no_tumor
  3: pituitary_tumor